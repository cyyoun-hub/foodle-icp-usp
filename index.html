<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 프로젝트 준비 완료 | Vibe Coding</title>
  <meta name="description" content="바이브코딩 새로운 웹 프로젝트의 시작 페이지입니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --secondary: #ec4899;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 {
      top: 15%;
      left: 20%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
      animation: float 8s ease-in-out infinite alternate;
    }
    .glow-2 {
      bottom: 15%;
      right: 20%;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, transparent 70%);
      animation: float 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    h1 {
      font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-text {
      background: linear-gradient(135deg, #818cf8 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-sub);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 36px;
      word-break: keep-all;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 36px;
      text-align: left;
    }

    .feature-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px;
      transition: all 0.3s ease;
    }
    .feature-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(99, 102, 241, 0.3);
      transform: translateY(-2px);
    }

    .feature-icon {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .feature-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 4px;
    }

    .feature-desc {
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 0;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px var(--primary-glow);
      transition: all 0.3s ease;
    }
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(236, 72, 153, 0.4);
    }
    .cta-button:active {
      transform: translateY(0);
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main class="container">
    <div class="badge">
      <span class="badge-dot"></span>
      배포 준비 완료 (Ready to Deploy)
    </div>

    <h1>
      새로운 프로젝트를 <br>
      <span class="gradient-text">시작할 준비가 되었습니다</span>
    </h1>

    <p>
      Vercel 배포 연결이 완료되었습니다.<br>
      어떤 웹사이트(랜딩페이지, 대시보드, 포트폴리오 등)를 만들지 말씀해 주시면 멋지게 구현해 드릴게요!
    </p>

    <div class="feature-grid">
      <div class="feature-item">
        <div class="feature-icon">🚀</div>
        <div class="feature-title">Vercel 호스팅</div>
        <div class="feature-desc">글로벌 CDN과 빠른 속도로 즉시 전 세계에 배포됩니다.</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">✨</div>
        <div class="feature-title">바이브 코딩</div>
        <div class="feature-desc">원하는 디자인과 아이디어를 대화로 바로 완성합니다.</div>
      </div>
    </div>

    <button class="cta-button" onclick="alert('배포가 성공적으로 완료되었습니다! 원하는 사이트 기능을 알려주세요.')">
      프로젝트 시작하기 →
    </button>
  </main>

  <footer>
    © 2026 Vibe Coding. Powered by Vercel.
  </footer>
</body>
</html>
